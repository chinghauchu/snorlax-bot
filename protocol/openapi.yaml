  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Chinghau Chu

servers:
  - url: http://127.0.0.1:8787
    description: First boot (no token file yet, localhost only)
  - url: http://0.0.0.0:8787
    description: After a token exists (LAN)

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Extra process ping (not the locked client ping)
      security: []
      operationId: processHealth
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true

  /v1/health:
    get:
      summary: Unauthenticated ping
      security: []
      operationId: health
      responses:
        "200":
          description: Runtime is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /v1/agents:
    get:
      summary: List agents
      operationId: listAgents
      responses:
        "200":
          description: JSON array of Agent (not wrapped)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
        "401":
          $ref: "#/components/responses/Error"
    post:
      summary: Create an agent or a channel
      description: |
        Default kind=agent. Pass `kind=channel` with `name` and `memberIds`
        to create an extra channel (listed on GET /v1/agents). Missing
        name, unknown member ids, and channel ids in the list 422.
        Omitted memberIds snapshot every current agent.
      operationId: createAgent
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /v1/agents/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: Get one agent
      operationId: getAgent
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      summary: Patch profile fields
      description: |
        kind=agent including seed `snorlax-bot`: `{ name, title,
        description, avatar }`. Avatar is string|null (data URL or
        existing image id). No new upload route. Id is not editable.
        User-created kind=channel: `{ name, memberIds, sharedProject }`
        returns 200. Seeded channel (`snorlax-bot-group`) identity PATCH
        returns 409 `{ error }`. Seed may PATCH `{ sharedProject }` only.
      operationId: patchAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentPatch"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete an agent
      description: |
        kind=agent including seed `snorlax-bot` returns 204 and is gone
        from GET /v1/agents. No auto-reseed; an empty agent roster is OK.
        kind=channel including seed `snorlax-bot-group` returns 204 and is
        gone from GET /v1/agents. No auto-reseed. User-created agent and
        channel DELETE is 204. DELETE of an agent or channel (including
        seed) drops that workspace dir.
      operationId: deleteAgent
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/agents/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: List transcript messages
      description: |
        Oldest-first. `before` is a message id cursor for older pages.
        For kind=agent (including seed `snorlax-bot`), the list is only
        `senderId=user` and that agent. Peer/involve/DM/hop messages are
        never in a 1:1. For kind=channel (`snorlax-bot-group`) the default
        list is the **timeline**: handoff roots (and other unreplied-to
        roots).         Thread replies are omitted. Question cards (`kind=widget`)
        and shell Approve cards (`kind=approve`) never appear on the
        timeline — only in a thread (`?threadId=`).
        Connect cards (`kind=connect`) follow the same thread-only rule.
        Pass `threadId` (or `replyTo`)
        to load that thread (root + flat replies).
      operationId: listMessages
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: before
          in: query
          schema:
            type: string
        - name: threadId
          in: query
          schema:
            type: string
          description: Channel thread id (the handoff root). Returns that thread.
        - name: replyTo
          in: query
          schema:
            type: string
          description: Alias of threadId.
      responses:
        "200":
          description: JSON array of Message (not wrapped)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      summary: Send a user message and stream agent replies
      description: |
        SSE. Legacy MessageCreate `images: [{ mime, data }]` are stored
        and returned at GET /v1/images/{id}; they are never forwarded to
        the model. v0.25 `attachmentIds` are included in that turn
        (image kinds as image input; file kinds as filename + text
        extract when text/*, else a short “user attached {name}” note).
        v0.27 video attachments persist on the message; apply_to_user_content
        skips kind=video bytes (no transcription in the user turn; a
        short user attached {name} stub is fine). v0.28 watch-video is
        opt-in via the built-in watch_video tool (attachmentId); the
        runtime does not auto-call it and never puts video bytes in the
        tool result or the user turn.
        The runtime owns the tool loop (clients never send a tools payload).
        A question card ends that agent turn: no more tokens or tools after
        `kind=widget` until the user answers or dismisses. Tools still
        auto-run except mutating shell (v0.32 `kind=approve`); widgets are
        not approval cards.

        For a 1:1 agent, hop 0 is that agent. Mentioned peers and hops
        reply in a handoff thread on seed `snorlax-bot-group` when present
        (ignore body `channelId`). Else if the 1:1 POST body has `channelId`
        and it is an existing kind=channel row, log there. Else skip the
        log (no handoff, no jump chip; still run B and A's report-back).
        Unknown/stale `channelId` after seed delete: skip log, do not 422,
        do not recreate seed. Not in either 1:1. A still
        answers in the 1:1. When the peer posts a material reply (or is
        hop/cap dropped), A is woken with a report-back pack and posts
        another assistant turn in that 1:1 (not a hop). Multiple
        `message.done` events on the same stream; the POST stays open
        until every mentioned peer has finished or been dropped and A
        has reported for each. Optional `replyTo` on the body posts into
        an existing channel thread. @mention inside an extra channel
        stays in that channel's thread.

        v0.31 regenerate: `{ "regenerate": true }` (empty/omitted
        content) replays the last user turn in a 1:1 without a new
        user-right bubble. Truncate the last assistant turn (that
        kind=message plus trailing kind=tool lines of that turn) then
        stream a replacement on the same SSE (message.delta,
        message.done, tool.*, Thinking wave). GET afterwards must not
        return the discarded text. 422 if there is no completed
        user→assistant turn, or if regenerate is combined with
        non-empty content / attachmentIds / widgetReply / connectReply /
        approveReply.
        409 if a stream is already open for that 1:1, or if the target
        is a channel. Desktop + iOS show Copy on completed LEFT
        kind=message (1:1 and channel); Regenerate only on the latest
        completed LEFT kind=message in a 1:1 (hidden while a stream is
        in flight).

        422 only for an unknown mention chip id (and `@everyone` chip
        outside the group). Typed `@foo` with no chip is plain text.
        Agent-authored unknown `@Name` is ignored. `@everyone` is group-only.

        - event `message.delta` data `{ id, role: "assistant", delta, senderId, senderName, senderAvatar }`
        - event `message.done` data full Message (not wrapped)
        - event `tool.start` data ToolTrace `{ id, name, summary, senderId, senderName }`
        - event `tool.done` data ToolTrace `{ id, name, summary, ok, senderId, senderName }`
        - event `error` data `{ error }` (string)

        Multiple `message.done` events may appear on one stream when more
        than one agent speaks in this transcript, and after each persisted
        tool line (`kind=tool`) or question card (`kind=widget`). Tool activity is stored as Message
        `kind=tool` with short content (`Read src/a.ts`, `Ran ls`,
        `Fetched …`), same senderId as the speaking agent, in that
        transcript only (1:1 if A tools; channel thread if B tools).
        Report-back into A's 1:1 is a normal assistant `kind=message` as A
        and does not copy B's tool lines or B's widgets or B's approve
        cards. A turn that ran tools always
        finishes with a normal assistant `kind=message` (streamed and
        persisted) unless the model asked a question card —         then the POST
        SSE ends on that `kind=widget` `message.done` (no `widget.*` event).
        A mutating shell command is the same persist-then-`message.done`
        shape with `kind=approve` (no `approve.*` event). Body is
        `{ command }` plus `approveStatus: pending`. Answer with
        `{ approveReply: { id, approved: true } }` or `{ dismissed: true }`
        on that transcript; that is not a user Message. After Approve the
        runtime runs the command and persists the existing 12px muted
        `kind=tool` line (`Ran {cmd}`), then continues this POST as hop-0.
        Deny patches that same card to `approveStatus=denied` (12px muted
        `Denied`), does not run, and does not wake the agent. Read-only
        shell (ls, cat, pwd, git status, git log, git diff, including
        simple flags/paths) auto-runs with no card. Any chain, pipe,
        redirection, && / ; / |, or anything else MUST gate. A Connect card for an unauthenticated MCP plugin is the same
        persist-then-`message.done` shape with `kind=connect` (no
        `connect.*` event on emit). Answer with `{ widgetReply: { id, values?, dismissed? } }` on that
        transcript; that is not a user Message. Connect is
        `{ connectReply: { id } }` or `{ dismissed: true }` — also not a
        user Message. Dismiss does not wake the
        agent and does not return a URL. `{ id }` while the plugin still
        needs auth stays pending, emits `event: connect.url` data
        `{ url, pluginId }` then ends this POST; the client opens the OS
        browser. When OAuth completes (runtime GET callback or POST
        `{ code, state }`), the same Message is PATCHed to
        connectStatus=connected and the agent turn continues (tools
        auto-run except mutating shell). If the plugin is already connected, `{ id }` PATCHes
        connected and continues this POST as hop-0. A pick continues this
        POST as hop-0 with the values. A
        normal content send while a card is pending is 409 unless
        dismissOnMoveOn (then auto-dismiss, no wake for the widget, then
        the new user message). Connect pending has no dismiss-on-move-on:
        content is 409 until connect or dismiss. Approve pending has no
        dismiss-on-move-on: content is 409 until Approve or Deny. One
        pending widget per transcript (409 if
        the model emits a second). One pending connect card per transcript.
        One pending approve card per transcript (409 if the model emits a
        second).
        Unknown id or already closed is 422.
        Empty model text or an inference error after tools still
        produce that follow-up; do not end on only a `kind=tool` line or
        `event:error` with no saved assistant message. Live `tool.start` /
        `tool.done` traces stay additive. Clients that do not understand
        `tool.*` skip those events and may still render `kind=tool` rows from GET.
        MCP tools reuse the same traces (`Used server__tool` / `Ran …`).
        Unknown events must still be ignorable. Widget rows follow
        senderId of the speaking agent (LEFT). GET 1:1 is still only user
        + that agent.
      operationId: postMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageCreate"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /v1/agents/{id}/routines:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: List routines assigned to this agent
      description: |
        JSON array of Routine (not wrapped). A routine is cron XOR
        trigger. `kind` is `cron` | `webhook` | `slack` | `github`.
        Cron rows have `schedule` (5-field, Asia/Taipei) and optional
        `scheduleLabel` (`Weekdays 9:00`). Webhook rows have
        `webhookUrl` (full URL with secret token in the path; Copy on
        the identity pane; clients must not paint it). Slack/GitHub
        rows are omitted unless GET /v1/plugins shows that plugin
        status=connected; when present they may have `label`
        (e.g. `Slack #eng`). Null fields are
        omitted (`webhookUrl` is absent on cron rows). Missing agent
        is 404. kind=channel is 409 (routines are agent-only). Used by
        the agent info pane (list + enable/pause + Copy for webhook
        URL). v0.17: trailing 12px `Add` opens a 320px Add routine
        sheet (name + 44px SKILL.md rows + segmented Schedule/Webhook;
        v0.23 adds Slack/GitHub segments only when that plugin is
        connected). Every row has muted 12px `Remove` (`Remove {name}?`).
        Pause stays. No edit-in-place. Humanized trigger
        line (`Webhook` / `Weekdays 9:00` / `Slack #eng` /
        `GitHub owner/name`) is a client concern. Webhook
        rows show 12px muted Copy left of Remove, then the pause switch
        (`Copied` for 1.5s); do not paint webhookUrl. Slack/GitHub rows
        have no Copy. Do not emit Connect cards from
        the pane.
      operationId: listRoutines
      responses:
        "200":
          description: JSON array of Routine
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Routine"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    post:
      summary: Create a routine for this agent
      description: |
        Body is cron XOR trigger. Cron:
        `{ name, skill, schedule }` (5-field or named hour, Asia/Taipei).
        Webhook: `{ name, skill, trigger: { type: webhook } }` — 201
        with `webhookUrl` (token in the path). POST of an event routine
        without a trigger is 422. POST with both schedule and trigger is
        422. Slack: `{ name, skill, trigger: { type: slack, channel } }`
        → 201 `kind=slack` `label="Slack {channel}"` (no webhookUrl).
        GitHub: `{ type: github, repo }` (`owner/name`, no wildcards) →
        201 `kind=github` `label="GitHub {repo}"`. Unconnected plugin,
        empty channel/repo, or wildcards → 422. Webhook works with zero
        plugins. 422 missing name/skill, unknown skill, bad cron, or
        channel id. Missing agent is 404. Pause stays PATCH `{ enabled }`.
        DELETE is a separate operation.
      operationId: createRoutine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutineCreate"
      responses:
        "201":
          description: Created routine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Routine"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /v1/agents/{id}/routines/{routineId}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: routineId
        in: path
        required: true
        schema:
          type: string
    patch:
      summary: Enable or pause a routine
      description: |
        `{ enabled: false }` pauses. `{ enabled: true }` resumes. This
        thin. No name/skill/schedule patch this slice.
        Unknown routine is 404. kind=channel is 409.
      operationId: patchRoutine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutinePatch"
      responses:
        "200":
          description: Updated routine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Routine"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    delete:
      summary: Remove a routine
      description: |
        `DELETE /v1/agents/{id}/routines/{routineId}` → 204, gone from
        GET. Unknown routine is 404. kind=channel is 409. Missing agent
        is 404. Pause stays a PATCH; this is Remove, not pause.
      operationId: deleteRoutine
      responses:
        "204":
          description: Deleted; no body
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/hooks/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: Secret token minted into webhookUrl. Not the routine id.
    post:
      summary: Fire a webhook routine
      description: |
        POST the minted webhookUrl. Does not use SNORLAX_TOKEN. The
        secret is the path token, not a query string and not a header.
        Unknown token, a non-webhook routine, or a paused webhook is
        404 and does not run. Success is 204, then the runtime runs
        that agent's SKILL.md into that agent's 1:1 as LEFT kind=message
        senderId=A with routineName. No catch-up. Isolation stands:
        never paint B in A's 1:1.
      operationId: fireWebhook
      security: []
      responses:
        "204":
          description: Fired; no body
        "404":
          $ref: "#/components/responses/Error"

  /v1/agents/{id}/skills:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: List discovered skills for this agent
      description: |
        Thin discovery. Runtime reads SKILL.md from
        SNORLAX_DATA_DIR/skills/<slug>/SKILL.md (and may also see a
        workspace SKILL.md). Returns `{ id, name }` per file (`id` is
        the directory slug or frontmatter name). Empty list is 200
        `[]`. Not a marketplace catalog. kind=channel is 409. Clients
        never read the host disk. v0.17 Add-routine picker reuses this
        list (`id` is the POST skill). v0.18 GET/PATCH/DELETE of one
        skill is `/skills/{sid}`; this list stays `{ id, name }` (no
        body). v0.22 blank New is POST `{ name, body }` (same list
        shape); body omitted still teach-a-task.
      operationId: listSkills
      responses:
        "200":
          description: JSON array of Skill `{ id, name }` (not wrapped)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Skill"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    post:
      summary: Create a skill (blank New or recorded demonstration)
      description: |
        One route, two bodies. Discriminate on `body` omitted vs present.
        Do not treat omitted body as blank create. No second POST path.

        `{ name, body }` (body present, non-empty) is blank New skill.
        Writes SNORLAX_DATA_DIR/skills/<slug>/SKILL.md via
        slugify_skill_name. **201** Skill `{ id, name }` (listed shape,
        not SkillBody). No computer capture required. `body` is the
        same shape as PATCH: full SKILL.md source (frontmatter plus
        recipe) or recipe-only. Empty name or empty body → **422**.

        `{ name }` with body omitted is still record-to-skill. Writes
        SKILL.md from the capture stopped with DELETE `/computer/record`
        (same v0.9 load path). 201 Skill `{ id, name }`. Discard is skip
        this POST — no SKILL.md. Empty name or no pending capture
        (still recording, never recorded, or discarded by next record /
        session end) is 422 (`no pending capture` / name).

        kind=channel is 409. Missing agent is 404. Edit is GET/PATCH
        `/skills/{sid}`. No marketplace.
      operationId: createSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillCreate"
      responses:
        "201":
          description: Written skill `{ id, name }`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /v1/agents/{id}/skills/{sid}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: sid
        in: path
        required: true
        schema:
          type: string
        description: |
          Skill id (directory slug under skills/<sid>/SKILL.md, or
          frontmatter name). Unknown is 404.
    get:
      summary: Get a skill's SKILL.md source
      description: |
        `{ id, name, body }`. `body` is the full SKILL.md **source**
        (YAML frontmatter plus recipe), not a rendered preview.
        kind=channel is 409. Missing agent is 404. Unknown sid is 404.
        List stays GET `/skills` `{ id, name }` (no `body` field).
      operationId: getSkill
      responses:
        "200":
          description: Skill with SKILL.md source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillBody"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    patch:
      summary: Edit a skill name and SKILL.md source
      description: |
        `{ name, body }` → **200** `{ id, name, body }`. Writes that
        SKILL.md in place. Keep the slug / skill `id` unless a name
        change truly requires a new slug — prefer keep `id` stable.
        Empty name or body is **422**. kind=channel is 409. Missing
        agent is 404. Unknown sid is 404. Blank New is POST `/skills
        { name, body }` (body present). `{ name }` omitted body stays
        teach-a-task.
      operationId: patchSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillPatch"
      responses:
        "200":
          description: Updated skill with SKILL.md source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillBody"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    delete:
      summary: Remove a skill
      description: |
        `DELETE /v1/agents/{id}/skills/{sid}` → **204**, gone from GET.
        Unknown sid is 404. kind=channel is 409. Missing agent is 404.
        Confirm chrome is `Remove {name}?`. Does not cascade-delete
        routines that still name the skill; those stay until a later
        422 on use.
      operationId: deleteSkill
      responses:
        "204":
          description: Deleted; no body
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/agents/{id}/workspace:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: List the conversation workspace
      description: |
        Runtime read of the existing sandbox (same roots as workspace_for).
        Clients never call tools or the model. Path default `.`. Empty
        workspace is `{ entries: [] }` and does not create the dir.
        `root` is sandbox-relative (`workspaces/agents/{id}` or
        `workspaces/channels/{id}`), never a Mac folder path.
        1:1 → that agent's workspace. Channel + sharedProject true →
        channel sandbox. Channel + sharedProject false → first member
        agent's workspace. Isolation: a 1:1 listing never includes
        another 1:1's files or a channel sandbox.
      operationId: listWorkspace
      parameters:
        - name: path
          in: query
          schema:
            type: string
            default: "."
          description: Directory relative to the workspace root.
      responses:
        "200":
          description: Directory listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceListing"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /v1/agents/{id}/workspace/file:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: Read a text file from the conversation workspace
      description: |
        UTF-8 text only. Size cap matches read_file (256k); larger text
        sets `truncated: true`. Binary (NUL in the first 4k) is 422
        `{ error: "binary / too large" }` — not a hex dump. Path escape
        is 422. Missing file is 404. Path default `.`.
      operationId: getWorkspaceFile
      parameters:
        - name: path
          in: query
          schema:
            type: string
            default: "."
          description: File path relative to the workspace root.
      responses:
        "200":
          description: File contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceFile"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /v1/agents/{id}/computer:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: Per-agent computer preview
      description: |
        Runtime-owned 1280x800 sandbox display. kind=channel is 409.
        Unknown agent is 404. `{ hasSandbox, width: 1280, height: 800,
        imageUrl }`. `imageUrl` is present only when hasSandbox is true:
        GET `/v1/agents/{id}/computer/screenshot` (Bearer, image/png).
        No sandbox: hasSandbox false, omit imageUrl, no frame on clients
        (`No computer yet.`). Idle desktop still returns a 1280x800 shot
        (always on). When hasSandbox, GET may include `driving`: `user`
        (takeover session), `agent` (agent last drove the sandbox), or
        `idle`. Omitted when hasSandbox is false. When hasSandbox, GET
        may include `recording` (boolean): true after POST
        `/computer/record`, false otherwise (idle, session without
        Record, or after DELETE `/computer/record`). Omitted when
        hasSandbox is false. Takeover is POST
        `/v1/agents/{id}/computer/session` (201 `{ sessionId }`) then
        pointer/key while the session exists. Workspace file-tree GETs
        are unchanged.
      operationId: getComputer
      responses:
        "200":
          description: Computer preview descriptor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComputerPreview"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/agents/{id}/computer/screenshot:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: Bearer PNG screenshot of the agent sandbox display
      description: |
        image/png of the live 1280x800 framebuffer. Same SNORLAX_TOKEN
        as other GETs. kind=channel is 409. Unknown agent is 404. No
        sandbox is 404. Idle still returns a desktop shot. Not a
        decorative static asset. Takeover input is POST session then
        pointer/key, not this GET.
      operationId: getComputerScreenshot
      responses:
        "200":
          description: PNG screenshot
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/agents/{id}/computer/session:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      summary: Open a desktop takeover session
      description: |
        201 `{ sessionId }`. User is driving; agent is paused and must
        not run tools that drive the sandbox (409). kind=channel is 409.
        Unknown agent is 404. No sandbox is 404. Idempotent if a session
        is already open (same sessionId). Desktop only this slice; iOS
        does not POST this route.
      operationId: openComputerSession
      responses:
        "201":
          description: Takeover session is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComputerSession"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      summary: End the takeover session (Done)
      description: |
        204. Returns to display-only; the next screenshot is the last
        frame. kind=channel is 409. Unknown agent is 404. Idempotent
        if no session is open. `DELETE .../computer/session/{sessionId}`
        also 204 for that session; unknown sessionId is 404.
      operationId: closeComputerSession
      responses:
        "204":
          description: Session closed
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/agents/{id}/computer/session/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: End a takeover session by id (Done)
      description: |
        204. Same as DELETE `/computer/session` for this sessionId.
        Unknown sessionId is 404. kind=channel is 409. Unknown agent
        is 404.
      operationId: closeComputerSessionById
      responses:
        "204":
          description: Session closed
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/agents/{id}/computer/pointer:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      summary: Pointer event in sandbox coordinates
      description: |
        Body `{ x, y, type }` with x/y in 1280x800. `type` is `move`,
        `down`, `up`, or `click`. 200. Requires an open session (409
        without one). kind=channel is 409. Unknown agent is 404. No
        sandbox is 404.
      operationId: postComputerPointer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PointerEvent"
      responses:
        "200":
          description: Pointer applied
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /v1/agents/{id}/computer/key:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      summary: Key event in the sandbox
      description: |
        Body `{ key, type, text? }`. `type` is `down`, `up`, or `type`.
        When `type` is `type`, `text` is preferred if present else `key`.
        200. Requires an open session (409 without one). kind=channel is
        409. Unknown agent is 404. No sandbox is 404.
      operationId: postComputerKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyEvent"
      responses:
        "200":
          description: Key applied
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /v1/agents/{id}/computer/record:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      summary: Start capture inside a takeover session
      description: |
        Record only inside a takeover session. 201 `{ recording: true }`.
        409 without session (`no computer session`) / already recording
        (`already recording`). kind=channel is 409. Missing agent is
        404. Desktop only this slice; iOS does not POST this route.
        Capture records pointer/key (and screenshot context) until
        DELETE this path. A new POST while a stopped capture is pending
        discards that pending capture.
      operationId: startComputerRecord
      responses:
        "201":
          description: Capture is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComputerRecording"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      summary: Stop capture (no SKILL.md yet)
      description: |
        204. Does NOT write SKILL.md. Capture stays pending until POST
        `/v1/agents/{id}/skills` (save) or discard (skip that POST;
        next record or session end discards). kind=channel is 409.
        Missing agent is 404. No session is 409. Idempotent if not
        recording while a session exists.
      operationId: stopComputerRecord
      responses:
        "204":
          description: Capture stopped; no file yet
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/plugins:
    get:
      summary: List runtime-owned MCP plugins
      description: |
        JSON array of Plugin (not wrapped): `{ id, name, status }` where
        status is `connected` or `needsAuth`. Catalog may be empty.
        Runtime-global (not per-agent). Clients never speak MCP; this is
        Settings chrome only, not the agent pane. Hand-edited mcp.json
        under SNORLAX_DATA_DIR still loads stdio and LAN servers. Add
        custom is POST this path. DELETE /v1/plugins/{id} uninstalls
        (disconnect + drop from catalog). No separate disconnect
        endpoint. No store / search / public marketplace. Curated
        Slack/GitHub list is GET /v1/plugins/catalog.
      operationId: listPlugins
      responses:
        "200":
          description: JSON array of Plugin
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plugin"
        "401":
          $ref: "#/components/responses/Error"
    post:
      summary: Add a custom MCP plugin
      description: |
        Body `{ name, transport: "stdio" | "url", command?, args?: string[],
        url? }`. Returns 201 `{ id, name, status: connected|needsAuth }`.
        stdio: command required (args optional). 422 if name or command
        missing. url: url required; allow https and http (LAN). 422 if
        missing/invalid. Persists into mcp.json under SNORLAX_DATA_DIR.
        Does not auto-open a kind=connect card. Clients never speak MCP.
        Catalog Add is this same POST (no extra sheet / no POST
        /catalog). No store / search / public marketplace.
      operationId: createPlugin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginCreate"
      responses:
        "201":
          description: Created plugin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plugin"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /v1/plugins/catalog:
    get:
      summary: List curated MCP plugins
      description: |
        JSON array of PluginCatalogEntry (not wrapped):
        `{ id, name, transport, command?, args?, url? }`. Same transport
        fields as PluginCreate so clients POST /v1/plugins with that
        body as-is (name + transport + command/args or url). Omit nulls.
        Curated in runtime code — not mcp.json, not a remote registry,
        no search. Exactly two entries when neither is installed, in
        this order: Slack (`id: slack`, `name: Slack`) then GitHub
        (`id: github`, `name: GitHub`). Each bakes a real stdio or url
        transport that POST /v1/plugins already accepts (npx stdio is
        fine). Omit a row when GET /v1/plugins already has a connected
        or needsAuth plugin whose id or name matches that kind (same
        needle as plugin_kind_connected: `slack` / `github` in id+name).
        If both are installed → 200 `[]`. Empty catalog is 200 `[]`
        (clients hide the Catalog header). Do not 404. No POST /catalog.
        No uninstall-from-catalog. Bearer as other /v1 routes.
        Runtime-global. Not a public store.
      operationId: listPluginCatalog
      responses:
        "200":
          description: JSON array of PluginCatalogEntry
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PluginCatalogEntry"
        "401":
          $ref: "#/components/responses/Error"

  /v1/plugins/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      summary: Uninstall a plugin
      description: |
        Disconnects the live session and drops the plugin row and
        credentials from the runtime MCP catalog. 204. Unknown id is 404.
        Does not auto-open a connect card. No separate disconnect
        endpoint. Clients never speak MCP.
      operationId: deletePlugin
      responses:
        "204":
          description: Uninstalled
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/plugins/{id}/auth:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      summary: Start plugin browser auth
      description: |
        Returns `{ authorizationUrl }` for the OS browser (desktop system
        browser; iOS ASWebAuthenticationSession). The OAuth callback hits
        the runtime. Unknown id is 404. After the browser finishes,
        GET /v1/plugins shows `connected` and tools auto-run (no approval
        widgets). A pending kind=connect card for this plugin is PATCHed
        to connected and that agent turn continues. Connect-card Connect
        tap is POST connectReply, which emits `connect.url` when the
        plugin still needs auth.
      operationId: startPluginAuth
      responses:
        "200":
          description: Browser URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginAuth"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/agents/{id}/attachments:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      summary: Upload a chat attachment
      description: |
        Bearer. Multipart field `file`. `{id}` is the same conversation
        as POST /v1/agents/{id}/messages (kind=agent 1:1 or kind=channel).
        Missing conversation 404. No /v1/chats/ resource. 201
        `{ id, kind, name, url, size }`. kind is `image` for image/*
        (not video); `video` for video/* or a video extension
        (.mp4/.mov/.m4v/.webm/.avi/.mkv); else `file`. url is GET
        /v1/attachments/{id} on this host (Bearer). image/file over
        10MB → 422 `Max 10MB.`. video over 50MB → 422 `Max 50MB.`.
        Empty file 422. User composer bind via
        MessageCreate.attachmentIds on the next send (video ids
        allowed). Runtime may also bind write_file / screenshot /
        sandbox video onto the assistant kind=message. Video bytes are
        not sent to the model. No agent upload route.
      operationId: postAttachment
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Created attachment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /v1/attachments/{id}:
    get:
      summary: Fetch attachment bytes
      description: |
        Bearer. Supports Attachment.url / Message.attachments[].url.
        Content-Type is the stored mime. 404 unknown. No unauthenticated
        fetch. Not /v1/chats/.
      operationId: getAttachment
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Attachment bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/images/{id}:
    get:
      summary: Fetch persisted image bytes
      description: Supports Message.images[].url. Never sent to the model.
      operationId: getImage
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Image bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: SNORLAX_TOKEN, or the value of ~/.snorlax-bot/token on the Spark.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: "`{ error }` as a string"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"

  schemas:
    Health:
      type: object
      required: [ok, name, version]
      properties:
        ok:
          type: boolean
          const: true
        name:
          type: string
          const: Snorlax-Bot
        version:
          type: string

    Agent:
      type: object
      required: [id, name, title, description, avatar, kind, memberIds, sharedProject, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: |
            Seed 1:1 is `snorlax-bot`. Seeded channel is `snorlax-bot-group`.
            Never reuse `snorlax-bot` as the channel transcript.
        name:
          type: string
          description: Display name. Seed 1:1 is Snorlax. Seeded channel is Snorlax-Bot.
        title:
          type: string
        description:
          type: string
        avatar:
          type: [string, "null"]
          description: |
            Data URL, existing image id, or null. Empty/null shows initials
            from name.
        kind:
          type: string
          enum: [agent, channel]
          description: |
            Clients show a muted "Channel" subtitle from kind=channel.
            Do not guess from id. Seed agent is kind=agent.
        memberIds:
          type: array
          items:
            type: string
          description: Agent ids in a channel. Empty for kind=agent. Channel members come from memberIds.
        sharedProject:
          type: boolean
          description: |
            Channel shared-project toggle, default false. When true, channel
            / handoff turns use workspaces/channels/{id}/. When false, the
            speaking agent's workspace. Ignored (always false) on kind=agent.
            Not a picker for a folder on the host Mac.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AgentCreate:
      type: object
      properties:
        name:
          type: string
          default: New agent
          minLength: 1
          maxLength: 80
        title:
          type: string
          default: ""
          maxLength: 80
        description:
          type: string
          default: ""
          maxLength: 8000
        avatar:
          type: [string, "null"]
        kind:
          type: string
          enum: [agent, channel]
          default: agent
          description: |
            `channel` creates an extra channel listed on GET /v1/agents.
        memberIds:
          type: array
          items:
            type: string
          description: |
            Channel members when kind=channel. Empty/omitted snapshots
            every current agent. Unknown ids and channel ids 422.
            Ignored for kind=agent.

    AgentPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        title:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 8000
        avatar:
          type: [string, "null"]
          description: |
            Data URL, existing image id, or null. Empty/null shows initials
            from name. PATCH only; no new upload route.
        memberIds:
          type: array
          items:
            type: string
          description: |
            User-created channel members. Agent ids only. Seed channel
            identity PATCH is 409. Unknown ids and channel ids 422.
        sharedProject:
          type: boolean
          description: |
            Channel shared-project toggle. Seed channel may PATCH this
            field only. kind=agent returns 422.

    ImageOut:
      type: object
      required: [id, mime, url]
      properties:
        id:
          type: string
        mime:
          type: string
        url:
          type: string

    ImageIn:
      type: object
      required: [mime, data]
      properties:
        mime:
          type: string
        data:
          type: string
          description: Base64 image bytes. Persisted; never sent to the model.

    Attachment:
      type: object
      required: [id, kind, name, url, size]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [image, file, video]
          description: |
            image for image/* (not video); video for video/* or a video
            extension; else file.
        name:
          type: string
        url:
          type: string
          description: Bearer GET /v1/attachments/{id} on this host.
        size:
          type: integer
          minimum: 0
          description: Byte length.

    Mention:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: Agent id, or `everyone` for @everyone.
        name:
          type: string

    HandoffRef:
      type: object
      required: [channelId, threadId]
      properties:
        channelId:
          type: string
        threadId:
          type: string

    Message:
      type: object
      required:
        [
          id,
          agentId,
          role,
          content,
          images,
          attachments,
          createdAt,
          senderId,
          senderName,
          senderAvatar,
          hop,
          mentions,
        ]
      properties:
        id:
          type: string
        agentId:
          type: string
          description: |
            Transcript owner. `snorlax-bot` is the Snorlax 1:1. `snorlax-bot-group`
            is the seeded channel. 1:1 lists are only user + that agent.
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          description: |
            Plain string. Runtime stores user and model text as-is.
            Do not add contentType, mime, html, or blocks[]. Do not rewrite
            assistant text to HTML or split one Message into many. SSE
            message.delta is text chunks of this same string. User
            messages stay plain text as stored. v0.11 clients render
            assistant LEFT kind=message as markdown.             widget, connect,
            tool, approve, and routineName stay. No MCP mix-in.
        images:
          type: array
          items:
            $ref: "#/components/schemas/ImageOut"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
          description: |
            kind=message rows (user-right or agent LEFT). kind=tool,
            widget, connect, and approve are []. Same shape as v0.25.
            Not a list-endpoint wrapper.
        createdAt:
          type: string
          format: date-time
        senderId:
          type: string
          description: "`user` or an agent id. Layout uses senderId === user → right; else left."
        senderName:
          type: string
        senderAvatar:
          type: [string, "null"]
        hop:
          type: integer
          minimum: 0
          description: User→current agent is 0. Mentions increment. Max depth 3.
        mentions:
          type: array
          items:
            $ref: "#/components/schemas/Mention"
        kind:
          type: string
          enum: [message, handoff, tool, widget, connect, approve]
          description: |
            Channel handoff root is `handoff` (LEFT card authored as A).
            Tool activity is `tool` (LEFT 12px muted status, short content
            like `Read src/a.ts` / `Ran ls` / `Fetched …`, same senderId as
            the agent). Question card is `widget` (LEFT card under the
            speaking agent's 20px avatar + 13px name; not a user-right
            bubble and not a token stream). Connect card is `connect`
            (same LEFT chrome family as widgets, NOT kind=widget).
            Shell Approve card is `approve` (same LEFT chrome family,
            dedicated kind — NOT a widget fork, NOT kind=widget). Default
            `message`. Do not drop kind=message|handoff|tool.
        replyTo:
          type: [string, "null"]
          description: Channel thread id. Null on timeline roots and on 1:1s.
        handoff:
          $ref: "#/components/schemas/HandoffRef"
          description: |
            Set on the originating **user** message when the user caused a
            handoff (an @chip in a 1:1). Absent/null if hop/cap dropped
            the mention, or if an agent DM created the thread without a
            user @chip. Not a fake speaker.
        userAsk:
          type: [string, "null"]
          description: Handoff root. The ask B should answer.
        brief:
          type: [string, "null"]
          description: |
            Handoff root. Last 8 user+A messages of the originating 1:1,
            cap 2k characters, oldest dropped.
        replyCount:
          type: integer
          minimum: 0
          description: Count of thread replies under a timeline root.
        widget:
          $ref: "#/components/schemas/Widget"
          description: |
            Set on kind=widget. Card fields only. Status and picked values
            are widgetStatus / widgetValues on this Message so GET can
            re-render the same card. Absent on other kinds. Never a
            user-right bubble.
        connect:
          $ref: "#/components/schemas/ConnectCard"
          description: |
            Set on kind=connect. Card fields only. Status lives on
            connectStatus on this Message so GET can re-render the same
            card. Absent on other kinds. Never a user-right bubble.
        connectStatus:
          type: string
          enum: [pending, connected, dismissed]
          description: |
            Set on kind=connect. pending until auth finishes or dismiss;
            connected after the OAuth callback PATCHes this row; dismissed
            after `{ dismissed: true }`.
        approve:
          $ref: "#/components/schemas/ApproveCard"
          description: |
            Set on kind=approve. Card fields only (`{ command }`). Status
            lives on approveStatus on this Message so GET can re-render
            the same card. Absent on other kinds. Never a user-right
            bubble. No cwd on the card.
        approveStatus:
          type: string
          enum: [pending, approved, denied]
          description: |
            Set on kind=approve. pending until an approveReply; approved
            after `{ approved: true }` (then the command runs and a
            kind=tool `Ran {cmd}` line is persisted); denied after
            `{ dismissed: true }` (Deny, including the card ×).
        widgetStatus:
          type: string
          enum: [pending, resolved, dismissed]
          description: |
            Set on kind=widget. pending until a widgetReply; resolved after
            a pick; dismissed after decline or dismissOnMoveOn.
        widgetValues:
          type: array
          items:
            type: string
          description: |
            Chosen option values (or custom text) after a pick. Empty while
            pending or dismissed.
        routineName:
          type: [string, "null"]
          description: |
            Set when this assistant Message is a routine result
            (cron or webhook). 12px kicker under the sender name.
            12px muted kicker under the sender name. Absent on ordinary
            turns. Not a channel post.

    WidgetOption:
      type: object
      required: [label]
      properties:
        label:
          type: string
        value:
          type: string
          description: Picked value. Defaults to label.
        description:
          type: string
        style:
          type: string
          enum: [default, primary, danger]
          default: default

    Widget:
      type: object
      required: [prompt, options]
      properties:
        prompt:
          type: string
          description: Natural-language question. Not a menu instruction.
        helpText:
          type: [string, "null"]
        options:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: "#/components/schemas/WidgetOption"
        allowCustom:
          type: boolean
          default: false
        multiSelect:
          type: boolean
          default: false
        dismissOnMoveOn:
          type: boolean
          default: false
          description: |
            If true, a normal content send auto-dismisses this card (no
            agent wake for the widget) and proceeds. If false, that send
            is 409 while the card is pending.

    WidgetReply:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: Message id of the pending kind=widget row.
        values:
          type: array
          items:
            type: string
          description: |
            Option values (default label) or custom text if allowCustom.
            multiSelect is several values; otherwise more than one is 422.
            Not persisted as a user Message.
        dismissed:
          type: boolean
          default: false
          description: |
            Decline the pending card. Updates that same Message to
            widgetStatus=dismissed. Does not create a user Message and
            does not wake the agent.

    ConnectCard:
      type: object
      required: [prompt, pluginId]
      properties:
        prompt:
          type: string
          description: |
            Natural prompt on the card, e.g. `Connect Slack to read your
            channels.`
        pluginId:
          type: string
          description: Plugin id from GET /v1/plugins.
        helpText:
          type: [string, "null"]
          description: Optional 12px muted help, e.g. `Opens your browser to sign in.`

    ConnectReply:
      type: object
      properties:
        id:
          type: string
          description: |
            Message id of the pending kind=connect row. Required unless
            dismissed is true (then the latest pending card in this
            transcript is used).
        dismissed:
          type: boolean
          default: false
          description: |
            Decline the pending card. Updates that same Message to
            connectStatus=dismissed. Does not create a user Message and
            does not wake the agent. `{ dismissed: true }` is enough;
            `{ id }` after the browser finishes sets connected and wakes
            the agent so tools auto-run.

    ApproveCard:
      type: object
      required: [command]
      properties:
        command:
          type: string
          description: |
            The shell command to Approve or Deny. Shown as 12px/12pt
            / 1.45 mono, max 2 lines + ellipsis. Desktop hover
            (title/tooltip) shows the full command; iOS long-press
            copies it. No cwd on the card.

    ApproveReply:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: Message id of the pending kind=approve row.
        approved:
          type: boolean
          default: false
          description: |
            Approve the pending command. Updates that same Message to
            approveStatus=approved, runs the command, then persists the
            existing kind=tool line (`Ran {cmd}`) and continues this POST
            as hop-0. Does not create a user Message.
        dismissed:
          type: boolean
          default: false
          description: |
            Deny the pending card (including the trailing ×). Updates
            that same Message to approveStatus=denied (12px muted
            Denied). Does not run the command, does not create a user
            Message, and does not wake the agent.

    MessageCreate:
      type: object
      properties:
        content:
          type: string
          minLength: 0
          maxLength: 32000
          description: |
            User text. Required unless widgetReply, connectReply,
            approveReply, a
            non-empty attachmentIds list (image-only / file-only /
            video-only send), or regenerate is true.
            Empty is allowed for those posts. A
            normal send while a question is pending is 409 unless
            dismissOnMoveOn. A send while a connect card is pending is
            409 until connect or dismiss. A send while an approve card
            is pending is 409 until Approve or Deny.
        images:
          type: array
          items:
            $ref: "#/components/schemas/ImageIn"
        attachmentIds:
          type: array
          items:
            type: string
          description: |
            Ids from POST /v1/agents/{id}/attachments on this same
            conversation. Unknown or foreign ids 422 (do not 404 the
            send). Empty content is ok if this list is non-empty
            (image / file / video ids). Runtime includes image and
            file kinds in that turn. kind=video is persisted and GET
            on the message but is not sent to the model. POST
            attachmentIds stay user-only. Runtime-produced write_file /
            screenshot / video files bind onto the assistant
            kind=message, not this field.
        mentions:
          type: array
          items:
            type: string
          description: |
            Agent ids from typeahead chips. Unresolved `@text` is omitted
            and is not a mention. Unknown chip ids 422. Runtime also
            parses exact `@DisplayName`. Peer deliveries from a 1:1 land
            in the seeded channel as a handoff thread when that channel
            exists (body `channelId` ignored). After the seed is gone,
            log on body `channelId` if it is an existing kind=channel row,
            else no log. Unknown/stale ids skip the log (do not 422),
            never in another agent's 1:1.
        replyTo:
          type: [string, "null"]
          description: Channel thread id when posting a reply in a thread.
        channelId:
          type: [string, "null"]
          description: |
            Optional. Used only as the A2A log fallback after seed
            `snorlax-bot-group` is gone. Ignored while the seed exists.
            After the seed is gone, 1:1 @involves log here if the id is
            an existing kind=channel row. Unknown, stale, or agent ids:
            skip the log (do not 422, do not recreate seed).
        widgetReply:
          $ref: "#/components/schemas/WidgetReply"
          description: |
            Answer the pending question card. `{ id, values }` resolves
            that same Message. `{ id, dismissed: true }` declines it and
            does not wake the agent. Not a user Message. Not a user-right
            bubble.
        connectReply:
          $ref: "#/components/schemas/ConnectReply"
          description: |
            Answer the pending connect card. `{ id }` marks that same
            Message connected and wakes the agent. `{ dismissed: true }`
            declines it and does not wake the agent. Not a user Message.
            Not a user-right bubble.
        approveReply:
          $ref: "#/components/schemas/ApproveReply"
          description: |
            Answer the pending shell Approve card. `{ id, approved: true }`
            runs that command. `{ id, dismissed: true }` is Deny and does
            not wake the agent. Not a user Message. Not a user-right
            bubble.
        regenerate:
          type: boolean
          default: false
          description: |
            v0.31. Replay the last user turn in this 1:1. Empty/omitted
            content. Does not create a user Message or a user-right
            bubble. Reuses that turn's content + attachmentIds +
            mentions. Truncates the last assistant turn (that
            kind=message plus trailing kind=tool lines of that turn)
            then streams a replacement (same SSE as send). 422 if there
            is no completed user→assistant turn, or if combined with
            non-empty content / attachmentIds / widgetReply /
            connectReply / approveReply. 409 if a stream is already open for that 1:1,
            or if the target is a channel. Channel has Copy, no
            Regenerate.

    MessageDelta:
      type: object
      required: [id, role, delta]
      properties:
        id:
          type: string
        role:
          type: string
          const: assistant
        delta:
          type: string
          description: |
            Text chunk of the assistant Message.content string. Concatenate
            in order to rebuild content. Not HTML, not a block, not a
            second Message.
        senderId:
          type: string
        senderName:
          type: string
        senderAvatar:
          type: [string, "null"]

    ToolTrace:
      type: object
      required: [id, name, summary]
      properties:
        id:
          type: string
        name:
          type: string
        summary:
          type: string
          description: Muted client line such as "Searching…" or "Wrote app.py".
        ok:
          type: [boolean, "null"]
        senderId:
          type: string
        senderName:
          type: string

    WorkspaceEntry:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [file, dir]
        size:
          type: integer
          minimum: 0
          description: Byte size for files. Omitted for directories.

    WorkspaceListing:
      type: object
      required: [root, path, entries]
      properties:
        root:
          type: string
          description: |
            Sandbox-relative root (`workspaces/agents/{id}` or
            `workspaces/channels/{id}`). Never a host Mac path.
        path:
          type: string
          description: Requested path relative to root. Default `.`.
        entries:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceEntry"

    WorkspaceFile:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
        content:
          type: string
        truncated:
          type: boolean
          description: True when the file was larger than the 256k cap.

    ComputerPreview:
      type: object
      required: [hasSandbox, width, height]
      properties:
        hasSandbox:
          type: boolean
          description: |
            False when this agent has no sandbox. Clients show 12px
            muted `No computer yet.` and no frame. True means the
            desktop is on (including idle) and imageUrl is a Bearer PNG.
        width:
          type: integer
          const: 1280
          description: Sandbox display width. Always 1280.
        height:
          type: integer
          const: 800
          description: Sandbox display height. Always 800.
        imageUrl:
          type: string
          description: |
            Present only when hasSandbox is true. Path to the Bearer PNG
            (`/v1/agents/{id}/computer/screenshot`). Same SNORLAX_TOKEN
            as other GETs. Omitted when hasSandbox is false.
        driving:
          type: string
          enum: [user, agent, idle]
          description: |
            Present when hasSandbox is true. `user` while a takeover
            session exists; `agent` after the agent drove the sandbox
            (`computer_click` / `computer_key`); `idle` otherwise.
            Omitted when hasSandbox is false.
        recording:
          type: boolean
          description: |
            Present when hasSandbox is true. true while POST
            `/computer/record` is capturing; false otherwise (idle,
            session without Record, or after DELETE `/computer/record`).
            Omitted when hasSandbox is false.

    ComputerSession:
      type: object
      required: [sessionId]
      properties:
        sessionId:
          type: string
          description: Opaque takeover session id. Same id if POST while already open.

    ComputerRecording:
      type: object
      required: [recording]
      properties:
        recording:
          type: boolean
          description: true after POST /computer/record.

    PointerEvent:
      type: object
      required: [x, y, type]
      properties:
        x:
          type: integer
          description: Sandbox x in 0..1279 (1280x800).
        y:
          type: integer
          description: Sandbox y in 0..799 (1280x800).
        type:
          type: string
          enum: [move, down, up, click]

    KeyEvent:
      type: object
      required: [key, type]
      properties:
        key:
          type: string
          description: Key name (`a`, `Enter`, `Backspace`, …).
        type:
          type: string
          enum: [down, up, type]
        text:
          type: string
          description: |
            Optional string to type. When type is `type`, preferred over
            `key` if present.

    Routine:
      type: object
      required: [id, name, skill, enabled, kind]
      properties:
        id:
          type: string
        name:
          type: string
        skill:
          type: string
          description: SKILL.md slug this routine fires.
        kind:
          type: string
          enum: [cron, webhook, slack, github]
          description: cron XOR webhook / slack / github.
        schedule:
          type: string
          description: >
            Cron only. 5-field cron in Asia/Taipei. Present only for
            kind=cron. Omitted otherwise.
        enabled:
          type: boolean
          description: false is paused. Resume is enabled true.
        scheduleLabel:
          type: string
          description: >
            Cron display (`Weekdays 9:00`). Present only for kind=cron.
        webhookUrl:
          type: string
          description: >
            Present only for kind=webhook. Full POST URL with the secret
            token in the path (`/v1/hooks/{token}`), not query. Copy
            this from the identity pane. Clients must not paint it as
            the muted line.
        label:
          type: string
          description: >
            Optional Slack/GitHub display (e.g. `Slack #eng`,
            `GitHub owner/repo`). Omitted for cron and webhook.

    RoutineTrigger:
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: >
            webhook, slack, or github. webhook always works (zero
            plugins). slack/github require GET /v1/plugins
            status=connected else 422. inbound Slack/GitHub delivery
            is the connected MCP plugin (no extra HTTP route).
        channel:
          type: string
          maxLength: 80
          description: >
            Slack channel (e.g. `#eng`). Required when type=slack.
            Empty is 422.
        repo:
          type: string
          maxLength: 80
          description: >
            GitHub `owner/name`. Required when type=github. One repo,
            no wildcards. Empty/wildcard is 422.
        label:
          type: string
          maxLength: 80
          description: >
            Ignored on POST. GET Routine.label is `Slack {channel}` /
            `GitHub {repo}`.

    RoutineCreate:
      type: object
      required: [name, skill]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        skill:
          type: string
          minLength: 1
          maxLength: 80
        schedule:
          type: string
          minLength: 1
          maxLength: 80
          description: >
            Cron XOR trigger. 5-field cron or a named hour (weekdays at
            9am). Asia/Taipei.
        trigger:
          $ref: "#/components/schemas/RoutineTrigger"

    RoutinePatch:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: true = enable/resume. false = pause.

    SkillInfo:
      type: object
      required: [name, description, source, path]
      properties:
        name:
          type: string
        description:
          type: string
        source:
          type: string
          enum: [workspace, skillsDir]
        path:
          type: string
          description: Path relative to the workspace or skills dir.

    Skill:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: |
            Directory slug under SNORLAX_DATA_DIR/skills/<id>/SKILL.md
            (v0.9 load path).
        name:
          type: string
          description: Frontmatter name (the POST body name).

    SkillCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: |
            Display name for the saved SKILL.md (frontmatter name).
            With `body` omitted, writes SNORLAX_DATA_DIR/skills/<slug>/SKILL.md
            from the stopped capture. Discard is omit this POST.
        body:
          type: string
          description: |
            When present and non-empty, write SKILL.md from this source
            (blank New skill; no capture required). Same shape as PATCH
            body: full SKILL.md source (frontmatter plus recipe) or
            recipe-only. Empty is 422. When omitted, teach-a-task from
            the pending capture (unchanged).

    SkillBody:
      type: object
      required: [id, name, body]
      properties:
        id:
          type: string
          description: |
            Directory slug under SNORLAX_DATA_DIR/skills/<id>/SKILL.md
            (v0.9 load path). PATCH does not rename the slug.
        name:
          type: string
          description: Frontmatter name.
        body:
          type: string
          description: |
            Full SKILL.md **source** including YAML frontmatter and
            recipe (not rendered HTML). Empty on PATCH is 422.

    SkillPatch:
      type: object
      required: [name, body]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        body:
          type: string
          minLength: 1
          description: |
            Full SKILL.md source (YAML frontmatter plus recipe). Empty is 422.

    Plugin:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [connected, needsAuth]
          description: |
            `connected` when the runtime has a live MCP session.
            `needsAuth` otherwise (including disabled / not signed in).

    PluginCreate:
      type: object
      required: [name, transport]
      description: |
        `transport` is `stdio` or `url`. stdio requires `command` (args
        optional). url requires `url` (http or https). Missing fields 422.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        transport:
          type: string
          enum: [stdio, url]
        command:
          type: string
          minLength: 1
        args:
          type: array
          items:
            type: string
        url:
          type: string
          description: LAN MCP URL (http or https).

    PluginCatalogEntry:
      type: object
      required: [id, name, transport]
      description: |
        Curated catalog row. Same transport fields as PluginCreate.
        Null command/args/url are omitted. Not a Plugin (no status).
      properties:
        id:
          type: string
        name:
          type: string
        transport:
          type: string
          enum: [stdio, url]
        command:
          type: string
          minLength: 1
        args:
          type: array
          items:
            type: string
        url:
          type: string
          description: LAN MCP URL (http or https).

    PluginAuth:
      type: object
      required: [authorizationUrl]
      properties:
        authorizationUrl:
          type: string
          description: |
            URL for the OS browser. OAuth callback hits the runtime.
            Clients never speak MCP.

    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: string

openapi: 3.1.0
info:
  title: Snorlax-Bot
  version: 0.12.0
  description: |
    Locked v0.12 LAN contract. Clients use SNORLAX_URL + SNORLAX_TOKEN.
    They never call vLLM, never call tools, never call MCP, and never read
    the Spark filesystem. Additive workspace GETs are runtime reads of the
    existing sandbox (same roots as the tool loop), not a second tool loop.
    Runtime owns the protocol. Clients render only and never invent fields.

    Seeded agent: id `snorlax-bot`, name Snorlax, title Assistant, kind
    `agent`. GET/POST /v1/agents/snorlax-bot/messages is the user–Snorlax
    1:1 only (user + that agent). Never the channel transcript.
    PATCH `{ name, title, description, avatar }` on kind=agent (including
    seed `snorlax-bot`) returns 200. Avatar is string|null (data URL or
    existing image id). No new upload route. Id is not a patch field.
    DELETE of kind=agent including seed `snorlax-bot` is 204, gone from
    GET /v1/agents, and is not auto-reseeded. An empty agent roster is OK.
    Seeded group channel: id `snorlax-bot-group`, name Snorlax-Bot, kind
    `channel`. Listed by GET /v1/agents like an agent. Every agent is a
    member; new agents auto-join the seed only if that row still exists.
    If the seed channel is gone they join nothing. POST /v1/agents with
    `kind=channel` plus `name` and `memberIds` creates extra channels.
    Missing name, unknown member ids, and channel ids in memberIds are 422.
    Seeded channel identity PATCH is 409 `{ error }`. User-created channel
    PATCH `{ name, memberIds }` is 200. DELETE of kind=channel including seed
    `snorlax-bot-group` is 204, gone from GET, no auto-reseed — never
    recreate `snorlax-bot-group`. Empty roster
    (no agents and/or no channels) is OK. User-created channel DELETE is 204.
    Members come from memberIds. New agents auto-join the seed only while
    it exists. User-created agent DELETE is still 204.

    Runtime-owned tools (v0.5): list_dir, read_file, write_file, delete_file,
    shell, web_search, web_fetch. The FastAPI runtime runs a function-calling
    loop against the local OpenAI-compat server (cap 8 rounds). Clients never
    construct tool calls. Tools auto-run (no approval cards). Question
    widgets are not tool-approval and do not gate shell/web/MCP.
    Workspaces live under ~/.snorlax-bot/workspaces/ (agents/{id} for 1:1).
    Channel shared project is a pane toggle (user-created + seed), default
    off (`sharedProject`). When on, channel / handoff turns use
    channels/{id}/; when off, the speaking agent's workspace. The channel
    project is that sandbox dir, not a picker for a folder on the host Mac.
    Path jail: tools cannot leave the active workspace root. Shell has no extra network; HTTP is web_search / web_fetch only. Search provider is
    configuration (SNORLAX_SEARCH_PROVIDER / SNORLAX_SEARCH_URL), not a
    hardcoded vendor. DELETE of an agent or channel (including seed) drops that
    workspace dir (no dir reseed). Tool activity persists as Message
    `kind=tool` (short content, same senderId) so GET matches live SSE.
    Compact 12px muted status sits under the speaking agent's LEFT streak;
    the final answer is a normal LEFT bubble. Report-back does not copy a
    peer's tool lines. Desktop may show a 320px computer pane (file tree +
    text preview) over those same sandbox roots. iOS sees chat/status lines
    only (no file browser this slice). No folder or path field;
    sharedProject is a boolean toggle. MCP is runtime-owned (stdio + LAN
    from mcp.json under SNORLAX_DATA_DIR); clients never speak MCP. No
    marketplace UI, no Settings picker, no browser-use GUI, no screenshot
    stream, no terminal GUI. Question widgets are v0.8. Skills and cron
    routines are v0.9. MCP connect chrome is v0.10 (GET /v1/plugins +
    POST /v1/plugins/{id}/auth + kind=connect). MCP Add custom is v0.12
    (POST /v1/plugins + DELETE /v1/plugins/{id} + optional disconnect).
    Hand-edited mcp.json still works. Plugins list is Settings only, not
    the agent pane. No marketplace catalog / public plugin store.
    Assistant markdown is v0.11 (clients render LEFT kind=message; content
    stays a plain string; runtime does not rewrite).

    Images persist and are returned; they are never sent to the model. No mDNS.

    Mentions are runtime-routed. Hop 0 is the user→current-agent turn.
    Max depth 3 (A→B→C→D ok; D→E dropped). Max 4 peer sends per user turn.
    Same-edge A→B once per turn. Drops are silent in the UI.
    Report-back into A's 1:1 is not a peer send and does not spend hop
    budget. If B is hop/cap dropped, A still reports that B was not reached.

    v0.1.1: a 1:1 transcript is only the user and that agent. Peer /
    involve / DM / hop traffic is addressed in a channel (default
    `snorlax-bot-group`) only.
    422 only for an unknown mention chip id. Typed `@foo` is plain text.

    v0.2: a user @chip in A's 1:1 (or A DMing B) opens a channel *thread*
    under a kind=handoff root authored as A. Pack B wakes with
    `{ originating, userAsk, brief, mentionedIds }` (not a quote).
    brief is the last 8 user+A messages of that 1:1, cap 2k chars.
    GET channel messages returns handoff roots (timeline) only.
    `?threadId=` (alias `?replyTo=`) returns that thread. Originating
    user messages that caused a handoff include `handoff: { channelId,
    threadId }`. Hop/cap drops omit that field.

    v0.3: header click opens an info pane (desktop 320px overlay on chat,
    iOS sheet). kind=agent is identity. Seed channel pane is a read-only
    member list from memberIds. User-created channel pane has a gear
    (PATCH name + memberIds). Never treat snorlax-bot-group as an agent profile. Delete stays on the sidebar (right-click / iOS swipe),
    including the seed row. No computer preview or connectors. Routines
    list under agent identity (v0.9).

    v0.4: collaboration report-back. 1:1 @involves log as handoff threads
    on seed `snorlax-bot-group` when present (body `channelId` ignored).
    If the seed is gone and the 1:1 POST body has `channelId` that is an
    existing kind=channel row, log there. Else skip the log (no handoff
    field, no jump chip; B still wakes; A's report-back still runs).
    Unknown/stale `channelId` after seed delete: skip log, do not 422, do
    not recreate seed. When B's thread turn completes or B
    is hop/cap dropped, enqueue a non-hop assistant generation for A on
    A's 1:1. Prompt pack `{ from, result, threadId, userAsk }` is not a
    Message field. Persist role=assistant senderId=A, no from field, no
    mentions of B. Fire A's report as each peer lands; hold the originating
    1:1 POST SSE until every mentioned B has done or been dropped and A
    has reported for each. Extra `message.done` on the same stream. B is
    prompted to do the work; no ACK classifier. Extra-channel @stays in
    that channel. Extra user-created channels are kind=channel rows.

    v0.5: runtime tool loop. Additive SSE `tool.start` / `tool.done` traces
    (`{ id, name, summary, ok?, senderId, senderName }`). Tool activity also
    persists as Message `kind=tool` so GET matches. A turn that ran tools
    always finishes with a normal assistant `kind=message`. Existing
    `message.delta` / `message.done` / `error` are unchanged. Desktop may
    show muted traces; unknown events must be ignored. Seeded channel DELETE
    is 204, gone from GET, no auto-reseed.

    v0.6: computer pane GETs. `GET /v1/agents/{id}/workspace` lists the
    active conversation's sandbox (1:1 → workspaces/agents/{id}/; channel
    with sharedProject true → workspaces/channels/{id}/; channel with
    sharedProject false → first member agent's workspace). `GET .../file`
    returns UTF-8 text (256k cap, truncated?). 404 conversation or missing
    path. 422 path escape or binary / too large. Path default `.`. No
    host-folder picker fields. No new SSE required; unknown events ignored.
    Seed channel DELETE stays 204. Seed identity PATCH stays 409 except
    sharedProject.

    v0.7: runtime MCP client. FastAPI loads mcp.json from SNORLAX_DATA_DIR
    (default ~/.snorlax-bot). Empty or missing file means no MCP; built-ins
    still work. stdio subprocess servers and LAN HTTP/SSE (streamable HTTP
    or legacy SSE). Tools join the existing OpenAI loop (auto-run, cap 8,
    kind=tool persist, tool.start/tool.done). Namespaced as server__tool;
    built-in names win on collision. MCP HTTP is a runtime path like
    web_fetch, not the agent shell. Shell still has no extra network. A
    failed MCP server start does not prevent boot. A failed MCP tool still
    leaves a normal assistant follow-up. LAN URLs may be loopback, RFC1918,
    or .local; 169.254.169.254 is rejected. No new client routes required.
    Desktop/iOS never speak MCP.

    v0.8: question widgets. Runtime-owned `ask_user_question` ends that
    agent turn (no more tokens or tools after the card). Persist as Message
    `kind=widget` (LEFT, same speaker as the agent) with body
    `{ prompt, helpText?, options[1-6]: { label, value?, description?,
    style? }, allowCustom?, multiSelect?, dismissOnMoveOn? }` plus
    `widgetStatus` pending|resolved|dismissed and `widgetValues` on that
    same Message. SSE: persist, then `message.done` with the full Message,
    then the stream ends. No `widget.*` event. Unknown events still
    ignorable. Answer is POST `{ widgetReply: { id, values?, dismissed? } }`
    on that transcript — not a user-right bubble and not a new user
    Message. Picked `values` are the option `value` (default label, or
    custom text if allowCustom); multiSelect is several values, else 422
    if more than one. Dismiss = decline; do not wake the agent. A pick
    wakes the agent with those values on the same POST. One pending widget
    per transcript: 409 if the model emits a second, or if the user POSTs
    normal content while pending unless `dismissOnMoveOn` (then
    auto-dismiss, no agent wake for the widget, then run the new user
    message). Phrase the prompt as a natural question, not a menu
    instruction. 1:1 isolation: only that speaker's transcript; B never
    widgets into A's 1:1; report-back never copies B's cards. Channel:
    widget only in a thread (`replyTo` set), never the timeline. Tools
    stay auto-run (no approval widget).

    v0.9: skills and cron routines. Skills are SKILL.md files the runtime
    loads from SNORLAX_DATA_DIR/skills/<slug>/SKILL.md (default
    ~/.snorlax-bot/skills/<slug>/SKILL.md). YAML frontmatter name +
    description, then markdown body. A skill is a reusable recipe; it has
    no trigger of its own. No marketplace / skill picker. One routine =
    one agent + one SKILL.md slug. Cron is 5-field, Asia/Taipei (fixed
    zone, not the Mac TZ). No Slack/GitHub/Origin or other event
    listeners. No teach-a-task. GET /v1/agents/{id}/routines lists
    `{ id, name, skill, schedule, enabled }` (bare array). Missing agent
    is 404. kind=channel is 409 (routines are agent-only). Pause/enable
    is PATCH `/v1/agents/{id}/routines/{rid}` `{ enabled }` (resume =
    enable); unknown routine 404; channel 409. Chrome is list +
    enable/pause only — no create / edit / delete UI, no extra sheet.
    POST may seed a routine for tests `{ name, skill, schedule }` (201);
    422 unknown skill / bad cron / channel id. No DELETE. A due cron
    wakes that agent in the FastAPI process if enabled. Persist a normal
    assistant Message in that agent's 1:1: senderId=A, kind=message,
    optional `routineName` for the kicker. Not a hop, not a widget, not
    a channel post. Isolation + report-back stand: never paint B in A's
    1:1. Do not run while paused. Missed ticks while the runtime was
    down are skipped (no catch-up storm). Tools still auto-run. Widgets
    OK if that run needs a decision (reuse v0.8 kind=widget; no second
    protocol). Agent info pane: Routines list under the 72px identity
    (desktop 320px overlay, iOS sheet). Channel pane unchanged. No extra
    computer preview. Clients never speak MCP or the model. No Mac
    folder picker. Seed DELETE 204, no auto-reseed. Unknown SSE events
    still ignorable. Existing message.delta / message.done / tool.* /
    kind=widget stand. Out of scope: box/VNC, teach-a-task, MCP
    marketplace UI, event listeners, computer pane changes, Mac folder
    picker. Do not reintroduce computerPane.ts (helpers stay
    workspaceTree.ts).

    v0.10: MCP connect chrome. Runtime still owns MCP (v0.7 mcp.json stdio
    + LAN). Clients never speak MCP or the model. GET /v1/plugins returns
    a bare array `{ id, name, status: connected|needsAuth }` (catalog may
    be empty). POST /v1/plugins/{id}/auth returns `{ authorizationUrl }`
    for the OS browser (desktop system browser; iOS
    ASWebAuthenticationSession); the OAuth callback hits the runtime.
    No uninstall / delete / store / search API this slice. No Add-custom
    UI (hand-edited mcp.json still works). Connect card is Message
    `kind=connect` (widget chrome family, NOT kind=widget) with
    `{ prompt, helpText?, pluginId }` plus `connectStatus`
    pending|connected|dismissed. SSE: persist, then `message.done`, stream
    ends. No `connect.*` event on the card emit. Unknown events remain
    ignorable. Answer is POST `{ connectReply: { id } }` or
    `{ dismissed: true }` — not a user-right bubble and not a new user
    Message. Dismiss does not wake and does not return a URL. Connect
    `{ id }` stays pending until auth finishes and emits `connect.url`
    `{ url, pluginId }` then ends (clients open the OS browser). The
    OAuth callback (GET on Spark :8787, or POST complete with code+state)
    PATCHes that Message to connectStatus=connected and continues the
    agent turn (tools auto-run, no approval widgets). Sending the card
    ends the turn until connect or dismiss. Isolation matches widgets:
    A's 1:1 only A's cards; channel thread only, never the timeline; B
    never paints in A's 1:1.
    Plugins list is Settings only (runtime-global), not the agent pane.
    Isolation, report-back, widgets, cron, seed DELETE 204, Mac oMLX, and
    no Mac folder picker stand. OpenAPI **0.10.0**.

    v0.11: assistant markdown. Clients render only. Message.content stays
    a string. Do not add contentType, mime, html, or blocks[]. The runtime
    does not rewrite assistant text to HTML or split one message into
    many. SSE message.delta is still text chunks of that same string.
    User messages stay plain text as stored. Clients render markdown.
    widget, connect, tool, and routine fields stay intact. No MCP mix-in.
    Assistant LEFT kind=message (from A) is 14px markdown with no grey
    agent bubble, 16/14 headings, lists, and bold. User-right stays plain
    text (https:// URLs tappable). Fenced code is full-turn 8px radius /
    elevated fill + 1px border / 12px muted language + Copy / 12px/1.45
    mono with horizontal scroll. https:// links are accent, hover
    underline, OS browser. Inline code is 13px mono, 4px radius, accent
    18% mix. Tool lines, widget
    cards, connect cards, thinking, and handoff are unchanged. Out of
    scope: mermaid, math/KaTeX, raw HTML (escape/strip; never inject HTML
    from model text). Isolation, report-back, widgets, cron, connect
    chrome, seed DELETE 204, Mac oMLX, no Mac folder picker, and
    workspaceTree.ts (never reintroduce computerPane.ts) stand. OpenAPI
    **0.11.0**.

    v0.12: MCP Add custom. Runtime still owns MCP (v0.7 mcp.json stdio +
    LAN). Clients never speak MCP or the model. Settings Plugins is
    Settings-only and runtime-global. POST /v1/plugins body
    `{ name, transport: "stdio" | "url", command?, args?: string[], url? }`
    → 201 `{ id, name, status: connected|needsAuth }`. stdio: command
    required (args optional); 422 if name or command missing. url: url
    required; allow https and http (LAN); 422 if missing/invalid. Persist
    into mcp.json under SNORLAX_DATA_DIR. DELETE /v1/plugins/{id}
    uninstalls (drops the row and credentials); 204; unknown 404. Do not
    auto-open a connect card. GET /v1/plugins and
    POST /v1/plugins/{id}/auth stay as v0.10. kind=connect isolation
    unchanged. POST /v1/plugins/{id}/disconnect may return a connected
    row to needsAuth without dropping the catalog. No store, no search
    catalog. Keep v0.8 widgets, v0.9 routines, seed DELETE 204, content
    string. Isolation, report-back, markdown, Mac oMLX, no Mac folder
    picker, and workspaceTree.ts (never reintroduce computerPane.ts)
    stand. Out of scope: full Box/VNC, teach-a-task, event listeners,
    marketplace catalog. OpenAPI **0.12.0**.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Chinghau Chu

servers:
  - url: http://127.0.0.1:8787
    description: First boot (no token file yet, localhost only)
  - url: http://0.0.0.0:8787
    description: After a token exists (LAN)

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Extra process ping (not the locked client ping)
      security: []
      operationId: processHealth
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true

  /v1/health:
    get:
      summary: Unauthenticated ping
      security: []
      operationId: health
      responses:
        "200":
          description: Runtime is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /v1/agents:
    get:
      summary: List agents
      operationId: listAgents
      responses:
        "200":
          description: JSON array of Agent (not wrapped)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
        "401":
          $ref: "#/components/responses/Error"
    post:
      summary: Create an agent or a channel
      description: |
        Default kind=agent. Pass `kind=channel` with `name` and `memberIds`
        to create an extra channel (listed on GET /v1/agents). Missing
        name, unknown member ids, and channel ids in the list 422.
        Omitted memberIds snapshot every current agent.
      operationId: createAgent
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /v1/agents/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: Get one agent
      operationId: getAgent
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      summary: Patch profile fields
      description: |
        kind=agent including seed `snorlax-bot`: `{ name, title,
        description, avatar }`. Avatar is string|null (data URL or
        existing image id). No new upload route. Id is not editable.
        User-created kind=channel: `{ name, memberIds, sharedProject }`
        returns 200. Seeded channel (`snorlax-bot-group`) identity PATCH
        returns 409 `{ error }`. Seed may PATCH `{ sharedProject }` only.
      operationId: patchAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentPatch"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete an agent
      description: |
        kind=agent including seed `snorlax-bot` returns 204 and is gone
        from GET /v1/agents. No auto-reseed; an empty agent roster is OK.
        kind=channel including seed `snorlax-bot-group` returns 204 and is
        gone from GET /v1/agents. No auto-reseed. User-created agent and
        channel DELETE is 204. DELETE of an agent or channel (including
        seed) drops that workspace dir.
      operationId: deleteAgent
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/agents/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: List transcript messages
      description: |
        Oldest-first. `before` is a message id cursor for older pages.
        For kind=agent (including seed `snorlax-bot`), the list is only
        `senderId=user` and that agent. Peer/involve/DM/hop messages are
        never in a 1:1. For kind=channel (`snorlax-bot-group`) the default
        list is the **timeline**: handoff roots (and other unreplied-to
        roots). Thread replies are omitted. Question cards (`kind=widget`)
        never appear on the timeline — only in a thread (`?threadId=`).
        Pass `threadId` (or `replyTo`)
        to load that thread (root + flat replies).
      operationId: listMessages
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: before
          in: query
          schema:
            type: string
        - name: threadId
          in: query
          schema:
            type: string
          description: Channel thread id (the handoff root). Returns that thread.
        - name: replyTo
          in: query
          schema:
            type: string
          description: Alias of threadId.
      responses:
        "200":
          description: JSON array of Message (not wrapped)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      summary: Send a user message and stream agent replies
      description: |
        SSE. Images are stored and returned; never forwarded to vLLM.
        The runtime owns the tool loop (clients never send a tools payload).
        A question card ends that agent turn: no more tokens or tools after
        `kind=widget` until the user answers or dismisses. Tools still
        auto-run; widgets are not approval cards.

        For a 1:1 agent, hop 0 is that agent. Mentioned peers and hops
        reply in a handoff thread on seed `snorlax-bot-group` when present
        (ignore body `channelId`). Else if the 1:1 POST body has `channelId`
        and it is an existing kind=channel row, log there. Else skip the
        log (no handoff, no jump chip; still run B and A's report-back).
        Unknown/stale `channelId` after seed delete: skip log, do not 422,
        do not recreate seed. Not in either 1:1. A still
        answers in the 1:1. When the peer posts a material reply (or is
        hop/cap dropped), A is woken with a report-back pack and posts
        another assistant turn in that 1:1 (not a hop). Multiple
        `message.done` events on the same stream; the POST stays open
        until every mentioned peer has finished or been dropped and A
        has reported for each. Optional `replyTo` on the body posts into
        an existing channel thread. @mention inside an extra channel
        stays in that channel's thread.

        422 only for an unknown mention chip id (and `@everyone` chip
        outside the group). Typed `@foo` with no chip is plain text.
        Agent-authored unknown `@Name` is ignored. `@everyone` is group-only.

        - event `message.delta` data `{ id, role: "assistant", delta, senderId, senderName, senderAvatar }`
        - event `message.done` data full Message (not wrapped)
        - event `tool.start` data ToolTrace `{ id, name, summary, senderId, senderName }`
        - event `tool.done` data ToolTrace `{ id, name, summary, ok, senderId, senderName }`
        - event `error` data `{ error }` (string)

        Multiple `message.done` events may appear on one stream when more
        than one agent speaks in this transcript, and after each persisted
        tool line (`kind=tool`) or question card (`kind=widget`). Tool activity is stored as Message
        `kind=tool` with short content (`Read src/a.ts`, `Ran ls`,
        `Fetched …`), same senderId as the speaking agent, in that
        transcript only (1:1 if A tools; channel thread if B tools).
        Report-back into A's 1:1 is a normal assistant `kind=message` as A
        and does not copy B's tool lines or B's widgets. A turn that ran tools always
        finishes with a normal assistant `kind=message` (streamed and
        persisted) unless the model asked a question card —         then the POST
        SSE ends on that `kind=widget` `message.done` (no `widget.*` event).
        A Connect card for an unauthenticated MCP plugin is the same
        persist-then-`message.done` shape with `kind=connect` (no
        `connect.*` event on emit). Answer with `{ widgetReply: { id, values?, dismissed? } }` on that
        transcript; that is not a user Message. Connect is
        `{ connectReply: { id } }` or `{ dismissed: true }` — also not a
        user Message. Dismiss does not wake the
        agent and does not return a URL. `{ id }` while the plugin still
        needs auth stays pending, emits `event: connect.url` data
        `{ url, pluginId }`, then ends this POST; the client opens the OS
        browser. When OAuth completes (runtime GET callback or POST
        `{ code, state }`), the same Message is PATCHed to
        connectStatus=connected and the agent turn continues (tools
        auto-run). If the plugin is already connected, `{ id }` PATCHes
        connected and continues this POST as hop-0. A pick continues this
        POST as hop-0 with the values. A
        normal content send while a card is pending is 409 unless
        dismissOnMoveOn (then auto-dismiss, no wake for the widget, then
        the new user message). Connect pending has no dismiss-on-move-on:
        content is 409 until connect or dismiss. One pending widget per transcript (409 if
        the model emits a second). One pending connect card per transcript.
        Unknown id or already closed is 422.
        Empty model text or an inference error after tools still
        produce that follow-up; do not end on only a `kind=tool` line or
        `event:error` with no saved assistant message. Live `tool.start` /
        `tool.done` traces stay additive. Clients that do not understand
        `tool.*` skip those events and may still render `kind=tool` rows from GET.
        MCP tools reuse the same traces (`Used server__tool` / `Ran …`).
        Unknown events must still be ignorable. Widget rows follow
        senderId of the speaking agent (LEFT). GET 1:1 is still only user
        + that agent.
      operationId: postMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageCreate"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /v1/agents/{id}/routines:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: List cron routines assigned to this agent
      description: |
        JSON array of Routine (not wrapped): `{ id, name, skill, schedule,
        enabled }`. Missing agent is 404. kind=channel is 409 (routines
        are agent-only). Used by the agent info pane (list + enable/pause
        only). schedule is 5-field cron in Asia/Taipei. Optional
        scheduleLabel is a display string. Humanized
        `{skill} · {Weekdays 9:00}` is a client concern.
      operationId: listRoutines
      responses:
        "200":
          description: JSON array of Routine
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Routine"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    post:
      summary: Seed a cron routine for this agent
      description: |
        Test/runtime seed. Body `{ name, skill, schedule }`. One routine
        = one agent + one SKILL.md slug. schedule is 5-field cron or a
        named hour (weekdays at 9am), Asia/Taipei. Clients have no create
        UI this slice. 422 unknown skill / bad cron / channel id.
        Missing agent is 404. No DELETE this slice.
      operationId: createRoutine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutineCreate"
      responses:
        "201":
          description: Created routine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Routine"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /v1/agents/{id}/routines/{routineId}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: routineId
        in: path
        required: true
        schema:
          type: string
    patch:
      summary: Enable or pause a routine
      description: |
        `{ enabled: false }` pauses. `{ enabled: true }` resumes. This
        thin. No name/skill/schedule patch this slice. No DELETE.
        Unknown routine is 404. kind=channel is 409.
      operationId: patchRoutine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutinePatch"
      responses:
        "200":
          description: Updated routine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Routine"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /v1/agents/{id}/skills:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: List discovered skills for this agent
      description: |
        Thin discovery. Runtime reads SKILL.md from
        SNORLAX_DATA_DIR/skills/<slug>/SKILL.md (and may also see a
        workspace SKILL.md). Not a marketplace catalog. kind=channel is
        422. Clients never read the host disk.
      operationId: listSkills
      responses:
        "200":
          description: JSON array of SkillInfo (not wrapped)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkillInfo"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /v1/agents/{id}/workspace:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: List the conversation workspace
      description: |
        Runtime read of the existing sandbox (same roots as workspace_for).
        Clients never call tools or the model. Path default `.`. Empty
        workspace is `{ entries: [] }` and does not create the dir.
        `root` is sandbox-relative (`workspaces/agents/{id}` or
        `workspaces/channels/{id}`), never a Mac folder path.
        1:1 → that agent's workspace. Channel + sharedProject true →
        channel sandbox. Channel + sharedProject false → first member
        agent's workspace. Isolation: a 1:1 listing never includes
        another 1:1's files or a channel sandbox.
      operationId: listWorkspace
      parameters:
        - name: path
          in: query
          schema:
            type: string
            default: "."
          description: Directory relative to the workspace root.
      responses:
        "200":
          description: Directory listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceListing"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /v1/agents/{id}/workspace/file:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: Read a text file from the conversation workspace
      description: |
        UTF-8 text only. Size cap matches read_file (256k); larger text
        sets `truncated: true`. Binary (NUL in the first 4k) is 422
        `{ error: "binary / too large" }` — not a hex dump. Path escape
        is 422. Missing file is 404. Path default `.`.
      operationId: getWorkspaceFile
      parameters:
        - name: path
          in: query
          schema:
            type: string
            default: "."
          description: File path relative to the workspace root.
      responses:
        "200":
          description: File contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceFile"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /v1/plugins:
    get:
      summary: List runtime-owned MCP plugins
      description: |
        JSON array of Plugin (not wrapped): `{ id, name, status }` where
        status is `connected` or `needsAuth`. Catalog may be empty.
        Runtime-global (not per-agent). Clients never speak MCP; this is
        Settings chrome only, not the agent pane. Hand-edited mcp.json
        under SNORLAX_DATA_DIR still loads stdio and LAN servers. Add
        custom is POST this path. Uninstall is DELETE /v1/plugins/{id}.
        Disconnect is POST /v1/plugins/{id}/disconnect. No store / search
        / marketplace catalog.
      operationId: listPlugins
      responses:
        "200":
          description: JSON array of Plugin
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plugin"
        "401":
          $ref: "#/components/responses/Error"
    post:
      summary: Add a custom MCP plugin
      description: |
        Body `{ name, transport: "stdio" | "url", command?, args?: string[],
        url? }`. Returns 201 `{ id, name, status: connected|needsAuth }`.
        stdio: command required (args optional). 422 if name or command
        missing. url: url required; allow https and http (LAN). 422 if
        missing/invalid. Persists into mcp.json under SNORLAX_DATA_DIR.
        Does not auto-open a kind=connect card. Clients never speak MCP.
        No store / search catalog.
      operationId: createPlugin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginCreate"
      responses:
        "201":
          description: Created plugin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plugin"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /v1/plugins/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      summary: Uninstall a plugin
      description: |
        Drops the plugin row and credentials from the runtime MCP catalog
        and tears down the live session. 204. Unknown id is 404. Does not
        auto-open a connect card. Clients never speak MCP.
      operationId: deletePlugin
      responses:
        "204":
          description: Uninstalled
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/plugins/{id}/disconnect:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      summary: Disconnect a plugin without uninstalling
      description: |
        Tears down the live MCP session and returns the catalog row to
        `needsAuth`. Does not drop the catalog entry. Unknown id is 404.
      operationId: disconnectPlugin
      responses:
        "200":
          description: Plugin now needsAuth
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plugin"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/plugins/{id}/auth:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      summary: Start plugin browser auth
      description: |
        Returns `{ authorizationUrl }` for the OS browser (desktop system
        browser; iOS ASWebAuthenticationSession). The OAuth callback hits
        the runtime. Unknown id is 404. After the browser finishes,
        GET /v1/plugins shows `connected` and tools auto-run (no approval
        widgets). A pending kind=connect card for this plugin is PATCHed
        to connected and that agent turn continues. Connect-card Connect
        tap is POST connectReply, which emits `connect.url` when the
        plugin still needs auth.
      operationId: startPluginAuth
      responses:
        "200":
          description: Browser URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginAuth"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/images/{id}:
    get:
      summary: Fetch persisted image bytes
      description: Supports Message.images[].url. Never sent to the model.
      operationId: getImage
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Image bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: SNORLAX_TOKEN, or the value of ~/.snorlax-bot/token on the Spark.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: "`{ error }` as a string"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"

  schemas:
    Health:
      type: object
      required: [ok, name, version]
      properties:
        ok:
          type: boolean
          const: true
        name:
          type: string
          const: Snorlax-Bot
        version:
          type: string

    Agent:
      type: object
      required: [id, name, title, description, avatar, kind, memberIds, sharedProject, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: |
            Seed 1:1 is `snorlax-bot`. Seeded channel is `snorlax-bot-group`.
            Never reuse `snorlax-bot` as the channel transcript.
        name:
          type: string
          description: Display name. Seed 1:1 is Snorlax. Seeded channel is Snorlax-Bot.
        title:
          type: string
        description:
          type: string
        avatar:
          type: [string, "null"]
          description: |
            Data URL, existing image id, or null. Empty/null shows initials
            from name.
        kind:
          type: string
          enum: [agent, channel]
          description: |
            Clients show a muted "Channel" subtitle from kind=channel.
            Do not guess from id. Seed agent is kind=agent.
        memberIds:
          type: array
          items:
            type: string
          description: Agent ids in a channel. Empty for kind=agent. Channel members come from memberIds.
        sharedProject:
          type: boolean
          description: |
            Channel shared-project toggle, default false. When true, channel
            / handoff turns use workspaces/channels/{id}/. When false, the
            speaking agent's workspace. Ignored (always false) on kind=agent.
            Not a picker for a folder on the host Mac.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AgentCreate:
      type: object
      properties:
        name:
          type: string
          default: New agent
          minLength: 1
          maxLength: 80
        title:
          type: string
          default: ""
          maxLength: 80
        description:
          type: string
          default: ""
          maxLength: 8000
        avatar:
          type: [string, "null"]
        kind:
          type: string
          enum: [agent, channel]
          default: agent
          description: |
            `channel` creates an extra channel listed on GET /v1/agents.
        memberIds:
          type: array
          items:
            type: string
          description: |
            Channel members when kind=channel. Empty/omitted snapshots
            every current agent. Unknown ids and channel ids 422.
            Ignored for kind=agent.

    AgentPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        title:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 8000
        avatar:
          type: [string, "null"]
          description: |
            Data URL, existing image id, or null. Empty/null shows initials
            from name. PATCH only; no new upload route.
        memberIds:
          type: array
          items:
            type: string
          description: |
            User-created channel members. Agent ids only. Seed channel
            identity PATCH is 409. Unknown ids and channel ids 422.
        sharedProject:
          type: boolean
          description: |
            Channel shared-project toggle. Seed channel may PATCH this
            field only. kind=agent returns 422.

    ImageOut:
      type: object
      required: [id, mime, url]
      properties:
        id:
          type: string
        mime:
          type: string
        url:
          type: string

    ImageIn:
      type: object
      required: [mime, data]
      properties:
        mime:
          type: string
        data:
          type: string
          description: Base64 image bytes. Persisted; never sent to the model.

    Mention:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: Agent id, or `everyone` for @everyone.
        name:
          type: string

    HandoffRef:
      type: object
      required: [channelId, threadId]
      properties:
        channelId:
          type: string
        threadId:
          type: string

    Message:
      type: object
      required:
        [
          id,
          agentId,
          role,
          content,
          images,
          createdAt,
          senderId,
          senderName,
          senderAvatar,
          hop,
          mentions,
        ]
      properties:
        id:
          type: string
        agentId:
          type: string
          description: |
            Transcript owner. `snorlax-bot` is the Snorlax 1:1. `snorlax-bot-group`
            is the seeded channel. 1:1 lists are only user + that agent.
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          description: |
            Plain string. Runtime stores user and model text as-is.
            Do not add contentType, mime, html, or blocks[]. Do not rewrite
            assistant text to HTML or split one Message into many. SSE
            message.delta is text chunks of this same string. User
            messages stay plain text as stored. v0.11 clients render
            assistant LEFT kind=message as markdown. widget, connect,
            tool, and routineName stay. No MCP mix-in.
        images:
          type: array
          items:
            $ref: "#/components/schemas/ImageOut"
        createdAt:
          type: string
          format: date-time
        senderId:
          type: string
          description: "`user` or an agent id. Layout uses senderId === user → right; else left."
        senderName:
          type: string
        senderAvatar:
          type: [string, "null"]
        hop:
          type: integer
          minimum: 0
          description: User→current agent is 0. Mentions increment. Max depth 3.
        mentions:
          type: array
          items:
            $ref: "#/components/schemas/Mention"
        kind:
          type: string
          enum: [message, handoff, tool, widget, connect]
          description: |
            Channel handoff root is `handoff` (LEFT card authored as A).
            Tool activity is `tool` (LEFT 12px muted status, short content
            like `Read src/a.ts` / `Ran ls` / `Fetched …`, same senderId as
            the agent). Question card is `widget` (LEFT card under the
            speaking agent's 20px avatar + 13px name; not a user-right
            bubble and not a token stream). Connect card is `connect`
            (same LEFT chrome family as widgets, NOT kind=widget). Default
            `message`. Do not drop kind=message|handoff|tool.
        replyTo:
          type: [string, "null"]
          description: Channel thread id. Null on timeline roots and on 1:1s.
        handoff:
          $ref: "#/components/schemas/HandoffRef"
          description: |
            Set on the originating **user** message when the user caused a
            handoff (an @chip in a 1:1). Absent/null if hop/cap dropped
            the mention, or if an agent DM created the thread without a
            user @chip. Not a fake speaker.
        userAsk:
          type: [string, "null"]
          description: Handoff root. The ask B should answer.
        brief:
          type: [string, "null"]
          description: |
            Handoff root. Last 8 user+A messages of the originating 1:1,
            cap 2k characters, oldest dropped.
        replyCount:
          type: integer
          minimum: 0
          description: Count of thread replies under a timeline root.
        widget:
          $ref: "#/components/schemas/Widget"
          description: |
            Set on kind=widget. Card fields only. Status and picked values
            are widgetStatus / widgetValues on this Message so GET can
            re-render the same card. Absent on other kinds. Never a
            user-right bubble.
        connect:
          $ref: "#/components/schemas/ConnectCard"
          description: |
            Set on kind=connect. Card fields only. Status lives on
            connectStatus on this Message so GET can re-render the same
            card. Absent on other kinds. Never a user-right bubble.
        connectStatus:
          type: string
          enum: [pending, connected, dismissed]
          description: |
            Set on kind=connect. pending until auth finishes or dismiss;
            connected after the OAuth callback PATCHes this row; dismissed
            after `{ dismissed: true }`.
        widgetStatus:
          type: string
          enum: [pending, resolved, dismissed]
          description: |
            Set on kind=widget. pending until a widgetReply; resolved after
            a pick; dismissed after decline or dismissOnMoveOn.
        widgetValues:
          type: array
          items:
            type: string
          description: |
            Chosen option values (or custom text) after a pick. Empty while
            pending or dismissed.
        routineName:
          type: [string, "null"]
          description: |
            Set when this assistant Message is a cron-routine result.
            12px muted kicker under the sender name. Absent on ordinary
            turns. Not a channel post.

    WidgetOption:
      type: object
      required: [label]
      properties:
        label:
          type: string
        value:
          type: string
          description: Picked value. Defaults to label.
        description:
          type: string
        style:
          type: string
          enum: [default, primary, danger]
          default: default

    Widget:
      type: object
      required: [prompt, options]
      properties:
        prompt:
          type: string
          description: Natural-language question. Not a menu instruction.
        helpText:
          type: [string, "null"]
        options:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: "#/components/schemas/WidgetOption"
        allowCustom:
          type: boolean
          default: false
        multiSelect:
          type: boolean
          default: false
        dismissOnMoveOn:
          type: boolean
          default: false
          description: |
            If true, a normal content send auto-dismisses this card (no
            agent wake for the widget) and proceeds. If false, that send
            is 409 while the card is pending.

    WidgetReply:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: Message id of the pending kind=widget row.
        values:
          type: array
          items:
            type: string
          description: |
            Option values (default label) or custom text if allowCustom.
            multiSelect is several values; otherwise more than one is 422.
            Not persisted as a user Message.
        dismissed:
          type: boolean
          default: false
          description: |
            Decline the pending card. Updates that same Message to
            widgetStatus=dismissed. Does not create a user Message and
            does not wake the agent.

    ConnectCard:
      type: object
      required: [prompt, pluginId]
      properties:
        prompt:
          type: string
          description: |
            Natural prompt on the card, e.g. `Connect Slack to read your
            channels.`
        pluginId:
          type: string
          description: Plugin id from GET /v1/plugins.
        helpText:
          type: [string, "null"]
          description: Optional 12px muted help, e.g. `Opens your browser to sign in.`

    ConnectReply:
      type: object
      properties:
        id:
          type: string
          description: |
            Message id of the pending kind=connect row. Required unless
            dismissed is true (then the latest pending card in this
            transcript is used).
        dismissed:
          type: boolean
          default: false
          description: |
            Decline the pending card. Updates that same Message to
            connectStatus=dismissed. Does not create a user Message and
            does not wake the agent. `{ dismissed: true }` is enough;
            `{ id }` after the browser finishes sets connected and wakes
            the agent so tools auto-run.

    MessageCreate:
      type: object
      properties:
        content:
          type: string
          minLength: 0
          maxLength: 32000
          description: |
            User text. Required unless widgetReply or connectReply. Empty
            is allowed only for a widgetReply or connectReply post. A
            normal send while a question is pending is 409 unless
            dismissOnMoveOn. A send while a connect card is pending is
            409 until connect or dismiss.
        images:
          type: array
          items:
            $ref: "#/components/schemas/ImageIn"
        mentions:
          type: array
          items:
            type: string
          description: |
            Agent ids from typeahead chips. Unresolved `@text` is omitted
            and is not a mention. Unknown chip ids 422. Runtime also
            parses exact `@DisplayName`. Peer deliveries from a 1:1 land
            in the seeded channel as a handoff thread when that channel
            exists (body `channelId` ignored). After the seed is gone,
            log on body `channelId` if it is an existing kind=channel row,
            else no log. Unknown/stale ids skip the log (do not 422),
            never in another agent's 1:1.
        replyTo:
          type: [string, "null"]
          description: Channel thread id when posting a reply in a thread.
        channelId:
          type: [string, "null"]
          description: |
            Optional. Used only as the A2A log fallback after seed
            `snorlax-bot-group` is gone. Ignored while the seed exists.
            After the seed is gone, 1:1 @involves log here if the id is
            an existing kind=channel row. Unknown, stale, or agent ids:
            skip the log (do not 422, do not recreate seed).
        widgetReply:
          $ref: "#/components/schemas/WidgetReply"
          description: |
            Answer the pending question card. `{ id, values }` resolves
            that same Message. `{ id, dismissed: true }` declines it and
            does not wake the agent. Not a user Message. Not a user-right
            bubble.
        connectReply:
          $ref: "#/components/schemas/ConnectReply"
          description: |
            Answer the pending connect card. `{ id }` marks that same
            Message connected and wakes the agent. `{ dismissed: true }`
            declines it and does not wake the agent. Not a user Message.
            Not a user-right bubble.

    MessageDelta:
      type: object
      required: [id, role, delta]
      properties:
        id:
          type: string
        role:
          type: string
          const: assistant
        delta:
          type: string
          description: |
            Text chunk of the assistant Message.content string. Concatenate
            in order to rebuild content. Not HTML, not a block, not a
            second Message.
        senderId:
          type: string
        senderName:
          type: string
        senderAvatar:
          type: [string, "null"]

    ToolTrace:
      type: object
      required: [id, name, summary]
      properties:
        id:
          type: string
        name:
          type: string
        summary:
          type: string
          description: Muted client line such as "Searching…" or "Wrote app.py".
        ok:
          type: [boolean, "null"]
        senderId:
          type: string
        senderName:
          type: string

    WorkspaceEntry:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [file, dir]
        size:
          type: integer
          minimum: 0
          description: Byte size for files. Omitted for directories.

    WorkspaceListing:
      type: object
      required: [root, path, entries]
      properties:
        root:
          type: string
          description: |
            Sandbox-relative root (`workspaces/agents/{id}` or
            `workspaces/channels/{id}`). Never a host Mac path.
        path:
          type: string
          description: Requested path relative to root. Default `.`.
        entries:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceEntry"

    WorkspaceFile:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
        content:
          type: string
        truncated:
          type: boolean
          description: True when the file was larger than the 256k cap.

    Routine:
      type: object
      required: [id, name, skill, schedule, enabled]
      properties:
        id:
          type: string
        name:
          type: string
        skill:
          type: string
          description: SKILL.md slug this routine fires.
        schedule:
          type: string
          description: 5-field cron. Interpreted in Asia/Taipei.
        enabled:
          type: boolean
          description: false is paused. Resume is enabled true.
        scheduleLabel:
          type: string
          description: Optional display string (Weekdays 9:00).

    RoutineCreate:
      type: object
      required: [name, skill, schedule]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        skill:
          type: string
          minLength: 1
          maxLength: 80
        schedule:
          type: string
          minLength: 1
          maxLength: 80
          description: 5-field cron or a named hour (weekdays at 9am).

    RoutinePatch:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: true = enable/resume. false = pause.

    SkillInfo:
      type: object
      required: [name, description, source, path]
      properties:
        name:
          type: string
        description:
          type: string
        source:
          type: string
          enum: [workspace, skillsDir]
        path:
          type: string
          description: Path relative to the workspace or skills dir.

    Plugin:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [connected, needsAuth]
          description: |
            `connected` when the runtime has a live MCP session.
            `needsAuth` otherwise (including disabled / not signed in).

    PluginCreate:
      type: object
      required: [name, transport]
      description: |
        `transport` is `stdio` or `url`. stdio requires `command` (args
        optional). url requires `url` (http or https). Missing fields 422.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        transport:
          type: string
          enum: [stdio, url]
        command:
          type: string
          minLength: 1
        args:
          type: array
          items:
            type: string
        url:
          type: string
          description: LAN MCP URL (http or https).

    PluginAuth:
      type: object
      required: [authorizationUrl]
      properties:
        authorizationUrl:
          type: string
          description: |
            URL for the OS browser. OAuth callback hits the runtime.
            Clients never speak MCP.

    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: string

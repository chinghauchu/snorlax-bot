[project]
name = "snorlax-runtime"
version = "0.8.0"
description = "Snorlax-Bot FastAPI runtime — agents, transcripts, LAN auth, built-in tools, MCP client, and question widgets in front of oMLX or vLLM."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Chinghau Chu" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.6.0",
  "aiosqlite>=0.20.0",
  "mcp>=1.9,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[project.scripts]
snorlax-runtime = "snorlax_runtime.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["snorlax_runtime*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
